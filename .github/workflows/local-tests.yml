name: Local synthetic MVP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # This job owns a new Docker stack. No hosted secrets are used.
      SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          npx playwright install --with-deps chromium
      - name: Static and synthetic-fixture safety checks
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          .venv/bin/python -m unittest discover -s tests/fixtures -v
      - name: Create disposable local stack and apply migrations
        run: |
          docker info > /dev/null
          supabase start
          supabase migration up --local
      - name: Seed and verify synthetic historical data
        run: |
          .venv/bin/python tests/fixtures/check_seed_rollback.py
          .venv/bin/python scripts/testing/seed_synthetic.py
          .venv/bin/python scripts/testing/seed_synthetic.py --check
      - name: Database assertions and independent-transaction races
        run: |
          npm run test:db
          npm run test:concurrency
      - name: Full browser suite against production server
        run: npm run test:e2e:production
      - name: Real local-mail confirmation and recovery with restored normal mode
        run: npm run test:confirmation
      - name: Check shared fixtures survived application tests
        run: .venv/bin/python scripts/testing/seed_synthetic.py --check
      - name: Stop this job's disposable stack
        if: always()
        run: supabase stop --no-backup
